services:
  todo-api:
    build: .
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - type: bind
        source: ${TODO_DATA_DIR:-C:/Users/HP/Desktop/TodoData}
        target: /data
        bind:
          create_host_path: false
    restart: unless-stopped
    networks:
      - devops

networks:
  devops:
    name: todo-staj-network
