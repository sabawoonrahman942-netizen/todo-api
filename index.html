<!DOCTYPE html>
<html lang="tr">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>To-Do Uygulaması</title></head>
<body>
<h1>To-Do Uygulaması</h1>
<p id="health" role="status">API kontrol ediliyor...</p>
<form id="form">
<label>Görev adı: <input id="title" required maxlength="200"></label><br><br>
<label>Açıklama: <input id="description" maxlength="5000"></label><br><br>
<label>Öncelik: <select id="priority"><option value="normal">Normal</option><option value="low">Düşük</option><option value="high">Yüksek</option><option value="urgent">Acil</option></select></label><br><br>
<button type="submit">Görev ekle</button>
</form>
<hr>
<h2>Görevler</h2>
<p id="message" role="status"></p>
<table border="1" cellpadding="8"><thead><tr><th>ID</th><th>Görev</th><th>Açıklama</th><th>Öncelik</th><th>Durum</th><th>İşlemler</th></tr></thead><tbody id="tasks"></tbody></table>
<script>
const $ = id => document.getElementById(id);
const endpoint = '/api/v1/todos';
const statuses = {pending:'Bekliyor',in_progress:'Devam ediyor',completed:'Tamamlandı'};
const priorities = {low:'Düşük',normal:'Normal',high:'Yüksek',urgent:'Acil'};
async function request(url, method='GET', body) {
  const options = {method};
  if (body !== undefined) { options.headers = {'Content-Type':'application/json'}; options.body=JSON.stringify(body); }
  const response=await fetch(url,options);
  if(response.status===204) return;
  const result=await response.json();
  if(!response.ok) throw new Error(result.error?.message || 'İstek başarısız: '+response.status);
  return result;
}
async function run(action) { try { $('message').textContent=''; await action(); } catch(error) { $('message').textContent=error.message; } }
async function load() {
  const all=[]; let offset=0;
  while(true){const result=await request(endpoint+'?limit=100&offset='+offset);all.push(...result.data);offset+=result.data.length;if(!result.data.length || offset>=result.pagination.total)break;}
  $('tasks').replaceChildren();
  for(const task of all){
    const row=$('tasks').insertRow();
    for(const value of [task.id,task.title,task.description,priorities[task.priority]||task.priority,statuses[task.status]||task.status]) row.insertCell().textContent=value;
    const cell=row.insertCell();
    const button=document.createElement('button');button.textContent=task.status==='completed'?'Tekrar aç':'Tamamla';button.onclick=()=>run(async()=>{await request(endpoint+'/'+task.id,'PATCH',{status:task.status==='completed'?'pending':'completed'});await load();});cell.append(button,' ');
    const edit=document.createElement('button');edit.textContent='Düzenle';edit.onclick=()=>run(async()=>{const title=prompt('Yeni görev adı:',task.title);if(title===null||!title.trim())return;await request(endpoint+'/'+task.id,'PATCH',{title:title.trim()});await load();});cell.append(edit,' ');
    const del=document.createElement('button');del.textContent='Sil';del.onclick=()=>run(async()=>{if(confirm('Görev silinsin mi?')){await request(endpoint+'/'+task.id,'DELETE');await load();}});cell.append(del);
  }
  $('message').textContent='Toplam görev: '+all.length;
}
$('form').addEventListener('submit',e=>{e.preventDefault();run(async()=>{await request(endpoint,'POST',{title:$('title').value,description:$('description').value,priority:$('priority').value,status:'pending'});e.target.reset();await load();});});
request('/health').then(r=>{$('health').textContent=r.status==='ok'&&r.database==='ok'?'API ve PostgreSQL çalışıyor.':'Bağlantı sorunu.';}).catch(()=>{$('health').textContent='API bağlantısı başarısız.';});
run(load);
</script>
</body></html>
