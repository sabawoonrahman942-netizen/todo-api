openapi: 3.0.3
info:
  title: To-Do API
  version: 2.0.0
  description: REST API for tasks and categories, backed by PostgreSQL.
servers:
  - url: http://localhost:3000
paths:
  /health:
    get:
      summary: Check API and database health
      responses:
        '200':
          description: API and database are available
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  database:
                    type: string
                    example: ok
        '503':
          description: Database is unavailable
  /api/v1/todos:
    get:
      summary: List todos
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, in_progress, completed]
        - in: query
          name: category_id
          schema:
            type: integer
            minimum: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Paginated todo list
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Todo'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      summary: Create a todo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TodoInput'
      responses:
        '201':
          description: Todo created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Todo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/todos/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      summary: Get a todo
      responses:
        '200':
          description: Todo found
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Todo'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Update a todo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TodoUpdate'
      responses:
        '200':
          description: Todo updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Todo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      summary: Delete a todo
      responses:
        '204':
          description: Todo deleted
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/categories:
    get:
      summary: List categories
      responses:
        '200':
          description: Category list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Category'
    post:
      summary: Create a category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryInput'
      responses:
        '201':
          description: Category created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/categories/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      summary: Get a category
      responses:
        '200':
          description: Category found
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Category'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Update a category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryUpdate'
      responses:
        '200':
          description: Category updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      summary: Delete a category; linked todos remain uncategorized
      responses:
        '204':
          description: Category deleted
        '404':
          $ref: '#/components/responses/NotFound'
components:
  parameters:
    Id:
      in: path
      name: id
      required: true
      schema:
        type: integer
        minimum: 1
  schemas:
    Todo:
      type: object
      required: [id, title, description, status, priority, category_id, created_at, updated_at]
      properties:
        id:
          type: integer
        title:
          type: string
          maxLength: 200
        description:
          type: string
        status:
          type: string
          enum: [pending, in_progress, completed]
        priority:
          type: string
          enum: [low, normal, high, urgent]
        due_at:
          type: string
          format: date-time
          nullable: true
        category_id:
          type: integer
          nullable: true
        category_name:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    TodoInput:
      type: object
      required: [title]
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 5000
        status:
          type: string
          enum: [pending, in_progress, completed]
          default: pending
        priority:
          type: string
          enum: [low, normal, high, urgent]
          default: normal
        due_at:
          type: string
          format: date-time
          nullable: true
        category_id:
          type: integer
          minimum: 1
          nullable: true
    TodoUpdate:
      type: object
      additionalProperties: false
      description: Supply one or more fields to update. All fields are optional.
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 5000
        status:
          type: string
          enum: [pending, in_progress, completed]
        priority:
          type: string
          enum: [low, normal, high, urgent]
        due_at:
          type: string
          format: date-time
          nullable: true
        category_id:
          type: integer
          minimum: 1
          nullable: true
    Category:
      type: object
      required: [id, name, color, created_at, updated_at]
      properties:
        id:
          type: integer
        name:
          type: string
          maxLength: 80
        color:
          type: string
          nullable: true
          pattern: '^#[0-9a-fA-F]{6}$'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CategoryInput:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        color:
          type: string
          nullable: true
          pattern: '^#[0-9a-fA-F]{6}$'
    CategoryUpdate:
      type: object
      additionalProperties: false
      description: Supply name, color, or both.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        color:
          type: string
          nullable: true
          pattern: '^#[0-9a-fA-F]{6}$'
    Pagination:
      type: object
      required: [limit, offset, total]
      properties:
        limit:
          type: integer
        offset:
          type: integer
        total:
          type: integer
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
  responses:
    BadRequest:
      description: Invalid request or field values
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: A unique field conflicts with an existing record
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
